<!-- index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SmartShop AI</title>

<script src="https://cdn.tailwindcss.com"></script>

<style>
body{
background:#0f172a;
color:white;
font-family:sans-serif;
margin:0;
padding:20px;
}

.card{
background:rgba(255,255,255,0.05);
padding:20px;
border-radius:20px;
margin-bottom:20px;
}

input{
width:100%;
padding:12px;
margin-top:10px;
margin-bottom:10px;
border-radius:10px;
border:none;
background:#1e293b;
color:white;
}

button{
padding:12px 20px;
border:none;
border-radius:10px;
background:#6366f1;
color:white;
font-weight:bold;
cursor:pointer;
}

.product{
display:flex;
justify-content:space-between;
padding:10px 0;
border-bottom:1px solid rgba(255,255,255,0.1);
}

.total{
font-size:24px;
font-weight:bold;
margin-top:20px;
}
</style>
</head>

<body>

<h1 class="text-3xl font-bold mb-6">
SmartShop AI 🚀
</h1>

<div class="card">

<h2 class="text-xl font-bold mb-4">
Add Product
</h2>

<input type="text" id="name" placeholder="Product Name">

<input type="number" id="price" placeholder="Price">

<button onclick="addProduct()">
Save Product
</button>

</div>

<div class="card">

<h2 class="text-xl font-bold mb-4">
Inventory
</h2>

<div id="inventory"></div>

</div>

<div class="card">

<h2 class="text-xl font-bold mb-4">
Billing
</h2>

<div id="bill"></div>

<div class="total">
Total:
<span id="total">₹0</span>
</div>

<button onclick="generateBill()" class="mt-4">
Generate WhatsApp Bill
</button>

</div>

<script>

let products =
JSON.parse(localStorage.getItem("products")) || [];

let bill = [];

function saveData(){
localStorage.setItem(
"products",
JSON.stringify(products)
);
}

function renderInventory(){

const inventory =
document.getElementById("inventory");

inventory.innerHTML = "";

products.forEach((p,index)=>{

inventory.innerHTML += `

<div class="product">

<div>
<b>${p.name}</b><br>
₹${p.price}
</div>

<button onclick="addToBill(${index})">
Add
</button>

</div>

`;

});

}

function addProduct(){

const name =
document.getElementById("name").value;

const price =
document.getElementById("price").value;

if(!name || !price){
alert("Fill all fields");
return;
}

products.push({
name,
price:Number(price)
});

saveData();

renderInventory();

document.getElementById("name").value="";
document.getElementById("price").value="";

alert("Product Added");

}

function addToBill(index){

bill.push(products[index]);

renderBill();

}

function renderBill(){

const billDiv =
document.getElementById("bill");

billDiv.innerHTML = "";

let total = 0;

bill.forEach(item=>{

total += item.price;

billDiv.innerHTML += `

<div class="product">

<span>${item.name}</span>

<span>₹${item.price}</span>

</div>

`;

});

document.getElementById("total")
.innerText = `₹${total}`;

}

function generateBill(){

let text =
"*SmartShop Bill*%0A%0A";

bill.forEach(item=>{

text +=
`${item.name} - ₹${item.price}%0A`;

});

text += `%0ATotal: ${
document.getElementById("total").innerText
}`;

window.open(
`https://wa.me/?text=${text}`,
"_blank"
);

}

renderInventory();

</script>

</body>
</html>
