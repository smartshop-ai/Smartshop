<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartShop AI | Next-Gen Billing</title>

    <link rel="manifest" href="manifest.json">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>

<body class="bg-slate-900 text-white min-h-screen font-sans">

<nav class="fixed bottom-0 w-full bg-slate-800/50 backdrop-blur-lg border-t border-white/10 z-50 flex justify-around p-4 md:top-0 md:bottom-auto md:flex-col md:w-20 md:h-full">

<button onclick="showSection('dashboard', this)" class="nav-btn active">
<i class="fas fa-chart-line text-xl"></i>
</button>

<button onclick="showSection('billing', this)" class="nav-btn">
<i class="fas fa-file-invoice-dollar text-xl"></i>
</button>

<button onclick="showSection('inventory', this)" class="nav-btn">
<i class="fas fa-boxes text-xl"></i>
</button>

</nav>

<main class="pb-24 md:pl-24 p-6 max-w-7xl mx-auto">

<section id="dashboard" class="content-section">
<header class="mb-8">
<h1 class="text-3xl font-bold">Business Overview</h1>
<p class="text-slate-400">Welcome back, Admin</p>
</header>
</section>

<section id="billing" class="content-section hidden">
<h2 class="text-2xl font-bold mb-6">New Billing</h2>

<div id="reader" class="hidden mb-4 overflow-hidden rounded-xl bg-black"></div>

<div class="glass-card p-6">
<input type="text" id="cust-name" placeholder="Customer Name" class="input-field">

<div id="cart-items"></div>

<div class="mt-4 font-bold text-xl">
Total: <span id="bill-total">₹0.00</span>
</div>

<button onclick="finalizeBill()" class="w-full bg-emerald-500 text-slate-900 font-bold py-4 rounded-xl mt-4">
GENERATE BILL
</button>
</div>
</section>

<section id="inventory" class="content-section hidden">
<h2 class="text-2xl font-bold mb-6">Inventory</h2>

<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4" id="inventory-list"></div>
</section>

</main>

<script src="app.js"></script>

<script>
if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js');
    });
}
</script>

</body>
</html>
